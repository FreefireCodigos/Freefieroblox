<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NickFinder - Símbolos</title>
    <style>
        :root { --bg-body: #f4f7f9; --sidebar-bg: #ffffff; --primary: #0984e3; --active: #74b9ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); margin: 0; display: flex; color: #333; }
        /* SIDEBAR */
        nav.sidebar { width: 260px; background: var(--sidebar-bg); height: 100vh; position: fixed; border-right: 1px solid #ddd; overflow-y: auto; }
        .sidebar-item { display: block; padding: 12px 20px; color: #555; text-decoration: none; transition: 0.3s; border-left: 4px solid transparent; }
        .sidebar-item:hover { background: #f0f4f8; }
        .sidebar-item.active { background: var(--active); color: white; border-left: 4px solid var(--primary); }
        .sidebar-category { background: #edf2f7; padding: 8px 20px; font-size: 0.8rem; font-weight: bold; color: #777; text-transform: uppercase; margin-top: 10px;}
        /* MAIN */
        main { margin-left: 260px; flex-grow: 1; padding: 30px; }
        header { text-align: center; margin-bottom: 30px; }
        .section-title { font-size: 1.4rem; margin: 30px 0 15px; border-bottom: 2px solid #ddd; padding-bottom: 5px; color: var(--primary);}
        .sym-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
        .sym-card { background: white; padding: 15px; text-align: center; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; font-size: 1.5rem; transition: 0.2s;}
        .sym-card:hover { background: var(--primary); color: white; transform: scale(1.1); }
        #toast { position: fixed; top: 20px; right: 20px; background: #2d3436; color: white; padding: 15px 25px; border-radius: 5px; display: none; z-index: 1000; font-size: 1.5rem;}
    </style>
</head>
<body>

    <nav class="sidebar">
        <div style="padding: 20px; font-weight: bold; color: var(--primary); font-size: 1.2rem;">NickFinder 3.0</div>
        <a href="simbolos.html" class="sidebar-item active">💎 Fuente y símbolos</a>
        <a href="combinar.html" class="sidebar-item">🔗 Combinar dos nombres</a>
        
        <div class="sidebar-category">Categorías</div>
        <a href="nombres-masculinos.html" class="sidebar-item">♂️ Nombres masculinos</a>
        <a href="nombres-femeninos.html" class="sidebar-item">♀️ Nombres femeninos</a>
    </nav>

    <main>
        <header>
            <h1>Banco de <span style="color:var(--primary)">Símbolos</span></h1>
            <p>Haz clic en cualquier símbolo para copiarlo al instante.</p>
        </header>

        <h2 class="section-title">⚔️ Armas y Letras Insanas</h2>
        <div class="sym-grid" id="armasGrid"></div>

        <h2 class="section-title">🌟 Estrellas y Cruces</h2>
        <div class="sym-grid" id="starsGrid"></div>

        <h2 class="section-title">😄 Caritas (Lenny Faces)</h2>
        <div class="sym-grid" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));" id="facesGrid"></div>
    </main>

    <div id="toast">Copiado: <span id="copiedSym"></span></div>

    <script>
        const armas = ["꧁", "꧂", "亗", "⚡", "☬", "༒", "☠︎︎", "☯︎", "Ⓔ", "𐄠", "〆", "ꪖ", "⚚", "︻╦╤─", "⌐╦╦═─", "︻デ═一"];
        const stars = ["★", "☆", "✡", "✦", "✧", "✩", "✪", "✫", "✬", "✭", "✮", "✯", "✰", "†", "☨", "✞", "✝", "☥", "☦", "☓", "☧", "☩", "☪", "☫", "☬", "☭"];
        const faces = ["( ͡° ͜ʖ ͡°)", "(◣_◢)", "¯\\_(ツ)_/¯", "(ง'̀-'́)ง", "ʕ•ᴥ•ʔ", "(ᵔᴥᵔ)", "×͜×", "♡‿♡"];

        function load(list, id) {
            const c = document.getElementById(id);
            list.forEach(s => { c.innerHTML += `<div class="sym-card" onclick="copy('${s}')">${s}</div>`; });
        }

        function copy(t) {
            navigator.clipboard.writeText(t);
            document.getElementById('copiedSym').innerText = t;
            let m = document.getElementById('toast'); m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 1500);
        }

        load(armas, 'armasGrid'); load(stars, 'starsGrid'); load(faces, 'facesGrid');
    </script>
</body>
</html>
